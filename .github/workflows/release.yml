name: release

# A `vX.Y.Z` tag on main publishes a GitHub Release, once the checks pass on the tagged commit.
# The steps to make one are in CONTRIBUTING.md, under Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse a tag outside main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the tag against the version, then take its changelog section
        run: python3 -m tools.release notes "$GITHUB_REF_NAME" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "Outpost ${GITHUB_REF_NAME#v}" --notes-file notes.md
