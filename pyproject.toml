[project]
name = "outpost"
version = "0.2.0"
description = "A dev container framework: one container as the entry point, locally or on a remote host, with Docker inside, an HTTPS proxy and copied logins."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
outpost = "outpost.launcher.cli.main:main"
outpost-container = "outpost.container.cli.main:main"

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outpost"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PTH", "RET"]
# Domain errors are named for what happened (`Declined`, `Unavailable`), not with an Error suffix.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["outpost", "tests", "tools"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]
mypy_path = "src"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------- import-linter
# The layering rules from docs/architecture.md, checked by pre-commit and CI.
[tool.importlinter]
root_package = "outpost"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "On each side, layers point down: cli, application, ports"
type = "layers"
containers = ["outpost.launcher", "outpost.container"]
layers = ["cli", "application", "ports"]

[[tool.importlinter.contracts]]
name = "The domain is pure and shared"
type = "forbidden"
source_modules = ["outpost.domain"]
forbidden_modules = ["outpost.launcher", "outpost.container", "outpost.infra", "yaml"]

[[tool.importlinter.contracts]]
name = "The two sides never import each other"
type = "independence"
modules = ["outpost.launcher", "outpost.container"]

[[tool.importlinter.contracts]]
name = "Use cases and ports never see adapters, config parsing or processes"
type = "forbidden"
source_modules = [
  "outpost.launcher.application",
  "outpost.launcher.ports",
  "outpost.container.application",
  "outpost.container.ports",
]
forbidden_modules = [
  "outpost.launcher.adapters",
  "outpost.launcher.config",
  "outpost.container.adapters",
  "outpost.infra",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "Adapters implement ports and never call use cases"
type = "forbidden"
source_modules = ["outpost.launcher.adapters", "outpost.container.adapters"]
forbidden_modules = [
  "outpost.launcher.application",
  "outpost.launcher.cli",
  "outpost.launcher.config",
  "outpost.container.application",
  "outpost.container.cli",
]

[[tool.importlinter.contracts]]
name = "Config parsing builds domain values only"
type = "forbidden"
source_modules = ["outpost.launcher.config"]
forbidden_modules = [
  "outpost.launcher.application",
  "outpost.launcher.adapters",
  "outpost.launcher.cli",
  "outpost.launcher.ports",
  "outpost.infra",
]

[[tool.importlinter.contracts]]
name = "Only cli.wiring chooses adapters"
type = "forbidden"
source_modules = ["outpost.launcher.cli", "outpost.container.cli"]
forbidden_modules = ["outpost.launcher.adapters", "outpost.container.adapters", "outpost.infra"]
ignore_imports = [
  "outpost.launcher.cli.wiring -> outpost.launcher.adapters.**",
  "outpost.launcher.cli.wiring -> outpost.infra.**",
  "outpost.container.cli.wiring -> outpost.container.adapters.**",
  "outpost.container.cli.wiring -> outpost.infra.**",
]
allow_indirect_imports = true
