[project]
name = "outpost"
version = "0.1.0"
description = "Remote development environments: one dev container with Docker inside, many worktrees, one HTTPS route per service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
outpost = "outpost.cli.main:main"

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outpost"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "PTH", "RET"]
# Domain errors are named for what happened (`Declined`, `Unavailable`), not with an Error suffix.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["outpost", "tests", "tools"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]
mypy_path = "src"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------- import-linter
# The layering rules from docs/architecture.md, checked by pre-commit and CI.
[tool.importlinter]
root_package = "outpost"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point down: cli, application, ports, domain"
type = "layers"
layers = ["outpost.cli", "outpost.application", "outpost.ports", "outpost.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["outpost.domain"]
forbidden_modules = ["outpost.adapters", "outpost.config", "yaml"]

[[tool.importlinter.contracts]]
name = "Application and ports never see adapters or config parsing"
type = "forbidden"
source_modules = ["outpost.application", "outpost.ports"]
forbidden_modules = ["outpost.adapters", "outpost.config", "yaml"]

[[tool.importlinter.contracts]]
name = "Adapters implement ports and never call use cases"
type = "forbidden"
source_modules = ["outpost.adapters"]
forbidden_modules = ["outpost.application", "outpost.cli", "outpost.config"]

[[tool.importlinter.contracts]]
name = "Config parsing builds domain values only"
type = "forbidden"
source_modules = ["outpost.config"]
forbidden_modules = ["outpost.application", "outpost.adapters", "outpost.cli", "outpost.ports"]

[[tool.importlinter.contracts]]
name = "Only cli.wiring chooses adapters"
type = "forbidden"
source_modules = ["outpost.cli"]
forbidden_modules = ["outpost.adapters"]
ignore_imports = ["outpost.cli.wiring -> outpost.adapters.**"]
allow_indirect_imports = true
