# outpost.yaml: every key is optional. Without this file, `./outpost up` runs on your local
# Docker with the default image and both logins. Copy it to outpost.yaml and keep what you need.

name: main                      # container outpost-main, volumes outpost-main-*
host: ssh://dev@my-vm           # default: local; your ssh config applies
domain: dev.localhost           # routes are https://<route>.dev.localhost:<port>
port: 8443                      # the proxy's port on 127.0.0.1, here and on the host

devcontainer:                   # any devcontainer.json property, merged over Outpost's defaults
  features:
    ghcr.io/devcontainers/features/dotnet:2: { version: "9.0" }
  containerEnv:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  runArgs: ["--cpus=8", "--memory=24g"]

init:                           # copied in, run as root at every start, in this order
  - scripts/clone-platform.sh

credentials: [claude, gh]       # logins checked and copied on every up; [] skips both

copy:                           # your machine -> the container, on every up
  ~/.npmrc: ~/.npmrc

persist:                        # more paths kept in volumes, beside home and /workspaces
  - /opt/tools
